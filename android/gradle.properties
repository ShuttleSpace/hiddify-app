org.gradle.jvmargs=-Xmx4048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false


org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
# JDK 17 is required by AGP 8.11. It is deliberately NOT pinned here: an
# org.gradle.java.home pointing at one machine's absolute JDK path works only
# there, and stops working the moment that JDK is upgraded or uninstalled. Set
# JAVA_HOME to a JDK 17 instead, which Gradle picks up on its own. `just` checks
# this for you before it reaches Gradle.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
