include: package:lint/strict.yaml

analyzer:
  exclude:
    - "hiddify-core/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mapper.dart"
    - "lib/gen/**"
    # protobuf / gRPC output — regenerated from .proto, never hand-edited
    - "lib/hiddifycore/generated/**"
    # vendored copy of the json_editor_flutter package
    - "lib/features/profile/details/json_editor.dart"
    - "build/**"
    - "dist/**"
    # vendored third-party packages: each carries its own pubspec and its own
    # dev_dependencies, which the root `flutter pub get` never installs
    - "packages/**"
  errors:
    invalid_annotation_target: ignore

formatter:
  page_width: 120

linter:
  rules:
    sort_pub_dependencies: false
    sort_unnamed_constructors_first: false
    avoid_classes_with_only_static_members: false
